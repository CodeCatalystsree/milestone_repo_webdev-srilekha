<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Document</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    table {
      width: 60%;
      margin: 20px auto;
      border-collapse: collapse;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 12px 20px;
      border: 1px solid #ccc;
      text-align: center;
    }

    th {
      background-color: #f04e4e;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>Tables for HTML</h1> 
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Aditi Sharma</td>
        <td>aditi@example.com</td>
      </tr>
      <tr>
        <td>Rahul Mehra</td>
        <td>rahulm@example.com</td>
      </tr>
      <tr>
        <td>Sneha Das</td>
        <td>sneha.das@example.com</td>
      </tr>
      <tr>
        <td colspan="2">thank you</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
