<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Chart</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          background-color: #f4f4f4;
          margin: 0;
          padding: 20px;
          text-align: center;
        }
    
        h1 {
          color: #333;
          margin-bottom: 30px;
        }
    
        table {
          margin: auto;
          width: 60%;
          border-collapse: collapse;
          background-color: #fff;
          box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    
        th, td {
          padding: 15px;
          text-align: center;
          border: 1px solid #ccc;
        }
    
        th {
          background-color: #0077b6;
          color: white;
          font-size: 18px;
        }
    
        tr:nth-child(even) {
          background-color: #f2f2f2;
        }
    
        tr:hover {
          background-color: #e0f7fa;
        }
      </style>
</head>
<body>
    <h1>Todays's Score Chart</h1>
    <div>
        <table border="solid">
            <thead>
              <tr>
                <th>Name</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Rahul Dravid</td>
                    <td>75(62)</td>
                </tr>
                <tr>
                    <td>Virat Kohli</td>
                    <td>98(Not out)</td>
                </tr>
                <tr>
                    <td>Sourav Ganguly</td>
                    <td>45(40)</td>
                </tr>
                <tr>
                    <td>Suresh Raina</td>
                    <td>85(Not out)</td>
                </tr>
                <tr>
                    <td>MS Dhoni</td>
                    <td>15(8)</td>
                </tr>

            </tbody>
        </table>
    </div>
</body>
</html>
